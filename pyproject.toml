[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "A local-first platform for evaluating tool-using agent reliability."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12.20250915",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["docs"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
